# Nginx reverse proxy configuration for Azaire Fleet Manager
# Copy this file to: /etc/nginx/sites-available/fleetbackend
# Then symlink: ln -s /etc/nginx/sites-available/fleetbackend /etc/nginx/sites-enabled/
#
# STEP 1: Deploy this HTTP-only config, test & reload nginx
# STEP 2: Run: sudo certbot --nginx -d fleetmanager.co.zw
#         Certbot will automatically add the SSL server block and redirect

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Upstream - matches PM2 cluster on port 3002
upstream fleetbackend {
    server 127.0.0.1:3002;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name fleetmanager.co.zw;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Client body size (for file uploads)
    client_max_body_size 10M;

    # Next.js static files - long cache
    location /_next/static {
        proxy_pass http://fleetbackend;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /static {
        proxy_pass http://fleetbackend;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=86400";
    }

    # API routes - rate limited
    location /api {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://fleetbackend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # All other routes (Next.js pages)
    location / {
        proxy_pass http://fleetbackend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
